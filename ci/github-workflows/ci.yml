name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests, PWA build and browser smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: cargo-bins/cargo-binstall@main
      - name: Install trunk and wasm-bindgen
        run: cargo binstall -y --locked trunk@0.22.1 wasm-bindgen-cli@0.2.130
      - name: Core and native tests
        run: cargo test -p airspace-core -p airspace-tauri
      - name: Build PWA
        working-directory: app
        run: trunk build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser smoke test
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node scripts/e2e-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: airspace-pwa
          path: app/dist
